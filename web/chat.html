<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agent Swarm 对话</title>
<link rel="icon" href="/logo.png" />
<style>
  :root{
    --bg:#0A0A0B; --bg2:#0E0E10; --card:#131316; --card2:#17171B;
    --line:#232328; --line2:#2C2C33;
    --text:#E8E8EA; --text2:#A1A1AA; --text3:#6B6B73;
    --amber:#F59E0B; --amber2:#FBBF24; --amber3:#B45309;
    --ok:#22C55E; --warn:#F59E0B; --bad:#EF4444;
    --radius:16px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:"Segoe UI","Microsoft YaHei UI","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    font-size:14.5px;line-height:1.65;overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  #app{display:flex;flex-direction:column;height:100vh}

  /* ---------- header ---------- */
  header{
    flex:0 0 auto;display:flex;align-items:center;gap:12px;
    padding:12px 20px;border-bottom:1px solid var(--line);
    background:rgba(10,10,11,.82);backdrop-filter:blur(14px);
    -webkit-app-region:drag;
  }
  header .logo{
    width:34px;height:34px;border-radius:10px;background:var(--card2);
    border:1px solid var(--line2);display:grid;place-items:center;flex:0 0 auto;
  }
  header .logo img{width:22px;height:22px;display:block}
  header h1{margin:0;font-size:15.5px;font-weight:600;letter-spacing:.2px}
  header .sub{font-size:11.5px;color:var(--text3);margin-top:-1px}
  header .spacer{flex:1}
  .chip{
    display:inline-flex;align-items:center;gap:7px;
    padding:5px 11px;border-radius:999px;font-size:12px;
    background:var(--card);border:1px solid var(--line);color:var(--text2);
    white-space:nowrap;
  }
  .dot{width:8px;height:8px;border-radius:50%;background:var(--text3);flex:0 0 auto}
  .dot.ok{background:var(--ok);box-shadow:0 0 0 3px rgba(34,197,94,.16)}
  .dot.warn{background:var(--warn);box-shadow:0 0 0 3px rgba(245,158,11,.16)}
  .dot.bad{background:var(--bad);box-shadow:0 0 0 3px rgba(239,68,68,.16)}
  .dot.pulse{animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  button{font-family:inherit}
  .btn{
    -webkit-app-region:no-drag;
    border:1px solid var(--line2);background:var(--card);color:var(--text);
    padding:7px 13px;border-radius:10px;font-size:12.5px;cursor:pointer;
    transition:background .14s,border-color .14s,color .14s;
  }
  .btn:hover{background:#1D1D22;border-color:#3A3A42}
  .btn:active{transform:translateY(1px)}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--text2)}
  .btn.ghost:hover{background:var(--card);color:var(--text)}
  .btn.danger{color:#FCA5A5;border-color:#4A2020}
  .btn.danger:hover{background:#2A1414;border-color:#7F2626}

  /* ---------- messages ---------- */
  main{flex:1;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth}
  main::-webkit-scrollbar{width:10px}
  main::-webkit-scrollbar-thumb{background:#26262C;border-radius:6px;border:3px solid var(--bg)}
  main::-webkit-scrollbar-thumb:hover{background:#33333B}
  .wrap{max-width:940px;margin:0 auto;padding:26px 20px 18px;display:flex;flex-direction:column;gap:18px}

  .empty{margin:auto;text-align:center;max-width:620px;padding:40px 20px;color:var(--text2)}
  .empty .big{width:64px;height:64px;border-radius:18px;background:var(--card2);border:1px solid var(--line2);
    display:grid;place-items:center;margin:0 auto 18px}
  .empty .big img{width:38px;height:38px}
  .empty h2{margin:0 0 8px;font-size:19px;color:var(--text);font-weight:600}
  .empty p{margin:0 0 22px;font-size:13.5px;line-height:1.75}
  .examples{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}
  .example{
    border:1px solid var(--line2);background:var(--card);border-radius:12px;
    padding:9px 14px;font-size:12.5px;color:var(--text2);cursor:pointer;
    transition:.15s;
  }
  .example:hover{border-color:var(--amber3);color:var(--text);background:#1A1510}

  .row{display:flex;gap:11px;align-items:flex-start;animation:in .22s ease-out}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .row.user{flex-direction:row-reverse}
  .avatar{
    flex:0 0 auto;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
    font-size:11px;font-weight:600;margin-top:2px;
  }
  .avatar.agent{background:var(--card2);border:1px solid var(--line2)}
  .avatar.agent img{width:18px;height:18px}
  .avatar.user{background:linear-gradient(135deg,var(--amber),#D97706);color:#1A1205}
  .body{min-width:0;max-width:82%;display:flex;flex-direction:column;gap:5px}
  .row.user .body{align-items:flex-end}
  .meta{font-size:11px;color:var(--text3);display:flex;gap:8px;align-items:center;padding:0 4px}
  .bubble{
    padding:11px 15px;border-radius:14px;white-space:pre-wrap;word-break:break-word;
    font-size:14px;line-height:1.72;
  }
  .row.agent .bubble{background:var(--card);border:1px solid var(--line);border-top-left-radius:5px}
  .row.user .bubble{background:linear-gradient(135deg,var(--amber),#E08900);color:#1A1205;border-top-right-radius:5px;font-weight:500}
  .bubble code{background:rgba(255,255,255,.09);padding:1.5px 5px;border-radius:5px;font-family:Consolas,monospace;font-size:12.5px}
  .row.user .bubble code{background:rgba(0,0,0,.16)}
  .bubble pre{
    background:#0B0B0D;border:1px solid var(--line2);border-radius:10px;
    padding:12px 14px;overflow-x:auto;margin:9px 0;white-space:pre;
  }
  .bubble pre code{background:none;padding:0;font-size:12.5px;line-height:1.6;color:#D6D6DB}
  .bubble a{color:var(--amber2)}
  .row.user .bubble a{color:#3B2400}
  .bubble p{margin:0 0 8px}
  .bubble p:last-child{margin-bottom:0}
  .bubble ul,.bubble ol{margin:6px 0;padding-left:20px}

  .steered{font-size:11.5px;color:var(--amber2);padding:0 4px}

  .thinking{display:flex;align-items:center;gap:9px;color:var(--text3);font-size:12.5px;padding:2px 4px}
  .tdots{display:inline-flex;gap:4px}
  .tdots i{width:5px;height:5px;border-radius:50%;background:var(--amber);display:block;animation:bounce 1.3s infinite}
  .tdots i:nth-child(2){animation-delay:.16s}
  .tdots i:nth-child(3){animation-delay:.32s}
  @keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}

  .taskline{font-size:11px;color:var(--text3);font-family:Consolas,monospace;padding:0 4px}
  .taskline b{color:var(--text2);font-weight:500}

  .msgerr{
    background:#2A1414;border:1px solid #5A2020;color:#FCA5A5;
    padding:10px 14px;border-radius:12px;font-size:13px;margin:0 4px;
  }

  /* ---------- composer ---------- */
  footer{flex:0 0 auto;border-top:1px solid var(--line);background:rgba(10,10,11,.9);backdrop-filter:blur(14px);padding:14px 20px 16px}
  .composer{max-width:940px;margin:0 auto}
  .box{
    display:flex;align-items:flex-end;gap:10px;
    background:var(--card);border:1px solid var(--line2);border-radius:16px;
    padding:9px 9px 9px 15px;transition:border-color .15s,box-shadow .15s;
  }
  .box:focus-within{border-color:#4A3A18;box-shadow:0 0 0 3px rgba(245,158,11,.09)}
  textarea{
    flex:1;background:transparent;border:0;outline:0;resize:none;color:var(--text);
    font-family:inherit;font-size:14px;line-height:1.6;max-height:190px;min-height:26px;
    padding:5px 0;
  }
  textarea::placeholder{color:var(--text3)}
  .send{
    flex:0 0 auto;width:38px;height:38px;border-radius:11px;border:0;cursor:pointer;
    background:linear-gradient(135deg,var(--amber),#D97706);color:#1A1205;
    display:grid;place-items:center;transition:.15s;
  }
  .send:hover{filter:brightness(1.09)}
  .send:disabled{background:#22222A;color:#55555D;cursor:not-allowed;filter:none}
  .send svg{width:17px;height:17px}
  .hint{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:8px;font-size:11.5px;color:var(--text3);padding:0 4px}
  .hint .k{font-family:Consolas,monospace;color:var(--text2)}
  .modes{display:flex;gap:6px}

  #toast{
    position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);
    background:#2A1414;border:1px solid #5A2020;color:#FCA5A5;
    padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;
    transition:.2s;z-index:50;max-width:80vw;
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo"><img src="/logo.png" alt="" /></div>
    <div>
      <h1>Agent Swarm 对话</h1>
      <div class="sub">和你的 AI 团队连续对话 · 随时补充</div>
    </div>
    <div class="spacer"></div>
    <span class="chip" id="statusChip"><span class="dot" id="statusDot"></span><span id="statusText">连接中…</span></span>
    <button class="btn ghost" id="btnNew" title="清空当前对话，重新开始">新对话</button>
  </header>

  <main id="main">
    <div class="wrap" id="wrap"></div>
  </main>

  <footer>
    <div class="composer">
      <div class="box">
        <textarea id="input" rows="1" placeholder="说点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
        <button class="send" id="btnSend" title="发送">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 19V5" /><path d="m5 12 7-7 7 7" />
          </svg>
        </button>
      </div>
      <div class="hint">
        <span id="hintLeft">对话会记住上下文；AI 干活时可以继续插话补充</span>
        <span class="k">Enter 发送 · Shift+Enter 换行</span>
      </div>
    </div>
  </footer>
</div>
<div id="toast"></div>

<!-- Runtime config, generated by setup (never committed). -->
<script src="/swarm-config.js"></script>
<script>
(function () {
  "use strict";

  // ---------------------------------------------------------------- config
  // API key is injected at runtime by /swarm-config.js so that this file can be
  // committed to a public repository without leaking credentials.
  const CFG = window.SWARM_CONFIG || {};
  const API_KEY = CFG.apiKey || "";
  const STORE = "agent-swarm-chat-v2";
  const POLL_MS = 2500;
  const MAX_WAIT_MS = 15 * 60 * 1000;

  const $ = (id) => document.getElementById(id);
  const el = { main: $("main"), wrap: $("wrap"), input: $("input"), send: $("btnSend"),
               statusChip: $("statusChip"), statusDot: $("statusDot"), statusText: $("statusText"),
               btnNew: $("btnNew"), toast: $("toast"), hintLeft: $("hintLeft") };

  const state = {
    messages: [],        // {id, role:'user'|'agent', text, ts, taskId?, steered?, error?}
    lastTaskId: null,
    activeTaskId: null,
    pollTimer: null,
    agents: {},
  };

  // ---------------------------------------------------------------- utils
  function authHeaders(extra) {
    return Object.assign({ Authorization: "Bearer " + API_KEY }, extra || {});
  }
  function nowTime() {
    const d = new Date();
    return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }
  function uid() { return Math.random().toString(36).slice(2, 10); }
  function toast(msg) {
    el.toast.textContent = msg;
    el.toast.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.toast.classList.remove("show"), 4200);
  }
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }
  // light markdown: code fences, inline code, bold, links, lists
  function md(src) {
    if (!src) return "";
    const blocks = [];
    let t = String(src).replace(/\r\n/g, "\n");
    t = t.replace(/```([\s\S]*?)```/g, (_m, code) => {
      const clean = String(code).replace(/^[a-zA-Z0-9_+-]*\n/, "");
      blocks.push("<pre><code>" + esc(clean.replace(/\n+$/, "")) + "</code></pre>");
      return "\u0000B" + (blocks.length - 1) + "\u0000";
    });
    t = esc(t);
    t = t.replace(/`([^`\n]+)`/g, "<code>$1</code>");
    t = t.replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
    t = t.replace(/(https?:\/\/[^\s<)]+)/g, '<a href="$1" target="_blank" rel="noreferrer">$1</a>');
    const lines = t.split("\n");
    let out = "", list = null;
    const flush = () => { if (list) { out += "</" + list + ">"; list = null; } };
    for (const line of lines) {
      if (/^\u0000B\d+\u0000$/.test(line.trim())) { flush(); out += line.trim(); continue; }
      const ul = line.match(/^\s*[-*·]\s+(.*)$/);
      const ol = line.match(/^\s*\d+[.)]\s+(.*)$/);
      if (ul) { if (list !== "ul") { flush(); out += "<ul>"; list = "ul"; } out += "<li>" + ul[1] + "</li>"; continue; }
      if (ol) { if (list !== "ol") { flush(); out += "<ol>"; list = "ol"; } out += "<li>" + ol[1] + "</li>"; continue; }
      flush();
      if (line.trim() === "") { out += ""; continue; }
      out += "<p>" + line + "</p>";
    }
    flush();
    out = out.replace(/\u0000B(\d+)\u0000/g, (_m, i) => blocks[Number(i)]);
    return out;
  }

  // ---------------------------------------------------------------- storage
  function save() {
    try {
      localStorage.setItem(STORE, JSON.stringify({
        messages: state.messages, lastTaskId: state.lastTaskId,
        activeTaskId: state.activeTaskId,
      }));
    } catch (e) {}
  }
  function load() {
    try {
      const raw = localStorage.getItem(STORE);
      if (!raw) return;
      const d = JSON.parse(raw);
      if (d && Array.isArray(d.messages)) {
        state.messages = d.messages;
        state.lastTaskId = d.lastTaskId || null;
        state.activeTaskId = d.activeTaskId || null;
      }
    } catch (e) {}
  }

  // ---------------------------------------------------------------- api
  async function api(path, opts) {
    const res = await fetch(path, Object.assign({}, opts, {
      headers: authHeaders(Object.assign({ "Content-Type": "application/json" }, (opts && opts.headers) || {})),
    }));
    if (!res.ok) {
      let detail = "";
      try { const j = await res.json(); detail = j.error || j.message || ""; } catch (e) {}
      throw new Error(res.status + " " + (detail || res.statusText));
    }
    const ct = res.headers.get("content-type") || "";
    return ct.includes("json") ? res.json() : res.text();
  }

  async function loadAgents() {
    try {
      const r = await api("/api/agents");
      const list = r.agents || r || [];
      state.agents = {};
      for (const a of list) state.agents[a.id] = a.name || "Agent";
    } catch (e) {}
  }

  async function createTask(text) {
    const body = { task: text, source: "ui" };
    if (state.lastTaskId) body.parentTaskId = state.lastTaskId;
    return api("/api/tasks", { method: "POST", body: JSON.stringify(body) });
  }

  async function steerTask(taskId, text) {
    return api("/api/tasks/" + taskId + "/steer", {
      method: "POST",
      body: JSON.stringify({ message: text, mode: "steer", onUnsupported: "degrade", source: "ui" }),
    });
  }

  async function getTask(id) { return api("/api/tasks/" + id); }

  async function cancelTask(id) {
    try { await api("/api/tasks/" + id + "/cancel", { method: "POST", body: "{}" }); } catch (e) {}
  }

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  // A steering message sent mid-task can be *queued* by the harness and applied
  // only after the task's own run ends (the server then overwrites the output).
  // So after completion, wait for every steering message to settle, then read
  // the task one more time to pick up the corrected result.
  async function waitSteering(taskId) {
    const deadline = Date.now() + 150000;
    while (Date.now() < deadline) {
      let all = [];
      try {
        const r = await api("/api/tasks/" + taskId + "/steering-messages");
        all = r.messages || r || [];
      } catch (e) {
        return null;
      }
      const settled = all.length > 0 && all.every((m) =>
        ["handled", "undeliverable", "failed", "expired", "cancelled", "canceled"]
          .includes(String(m.status).toLowerCase()));
      if (settled) {
        try { return await getTask(taskId); } catch (e) { return null; }
      }
      await sleep(POLL_MS);
    }
    try { return await getTask(taskId); } catch (e) { return null; }
  }

  // When the task.output is empty (plain-text replies), dig the last assistant
  // text part out of the session log: the final answer is emitted last.
  async function extractFromLogs(taskId) {
    try {
      const data = await api("/api/tasks/" + taskId + "/session-logs");
      const logs = Array.isArray(data) ? data
        : (data.logs || data.entries || data.sessionLogs || data.data || []);
      if (!Array.isArray(logs)) return "";
      const parts = new Map();
      logs.forEach((e, i) => {
        const type = String(e.type || e.event || e.kind || "");
        const p = e.properties || e.data || e.payload || {};
        if (type.includes("part.delta") || type.includes("part.delta") === false && p.delta) {
          const field = p.field || p.name || "text";
          if (field !== "text" && field !== "content") return;
          const delta = p.delta != null ? p.delta : (p.text != null ? p.text : p.content);
          if (!delta) return;
          const pid = String(p.partID || p.partId || p.id || "x");
          const cur = parts.get(pid) || { text: "", last: -1 };
          cur.text += delta;
          cur.last = i;
          parts.set(pid, cur);
        } else if (type.includes("part.updated")) {
          const part = p.part || {};
          if (part.type !== "text" || typeof part.text !== "string") return;
          const pid = String(part.id || p.partID || ("u" + i));
          parts.set(pid, { text: part.text, last: i });
        }
      });
      let best = "", bestIdx = -1;
      for (const v of parts.values()) {
        const txt = (v.text || "").trim();
        if (txt && v.last >= bestIdx) { bestIdx = v.last; best = txt; }
      }
      return best;
    } catch (e) { return ""; }
  }

  async function resolveReply(task) {
    let out = (task.output || "").trim();
    if (out) return out;
    // some builds wrap it
    if (task.result && typeof task.result === "string") return task.result.trim();
    return await extractFromLogs(task.id);
  }

  // ---------------------------------------------------------------- render
  function render() {
    el.wrap.innerHTML = "";
    if (!state.messages.length) {
      el.wrap.appendChild(renderEmpty());
      return;
    }
    for (const m of state.messages) el.wrap.appendChild(renderMessage(m));
    scrollDown(true);
  }

  function renderEmpty() {
    const d = document.createElement("div");
    d.className = "empty";
    d.innerHTML =
      '<div class="big"><img src="/logo.png" alt=""></div>' +
      "<h2>开始和 AI 团队对话</h2>" +
      "<p>直接说你要做什么。它会连续记住上下文，<br/>执行过程中你还能随时插话补充要求。</p>" +
      '<div class="examples"></div>';
    const ex = d.querySelector(".examples");
    [
      "帮我看看 C 盘哪些文件夹最占空间",
      "把这段需求整理成一份开发计划",
      "写一个 Python 脚本批量重命名文件",
      "解释一下我的项目结构有什么问题",
    ].forEach((t) => {
      const b = document.createElement("button");
      b.className = "example";
      b.textContent = t;
      b.onclick = () => { el.input.value = t; autoGrow(); el.input.focus(); };
      ex.appendChild(b);
    });
    return d;
  }

  function renderMessage(m) {
    const row = document.createElement("div");
    row.className = "row " + m.role;

    const av = document.createElement("div");
    av.className = "avatar " + m.role;
    if (m.role === "agent") av.innerHTML = '<img src="/logo.png" alt="">';
    else av.textContent = "你";
    row.appendChild(av);

    const body = document.createElement("div");
    body.className = "body";

    const meta = document.createElement("div");
    meta.className = "meta";
    const who = m.role === "agent" ? (m.agentName || "Agent") : "我";
    meta.innerHTML = "<span>" + esc(who) + "</span><span>" + esc(m.ts || "") + "</span>";
    if (m.role === "agent" && m.steeredSize) meta.innerHTML += "<span style='color:var(--amber2)'>已接收 " + m.steeredSize + " 条补充</span>";
    body.appendChild(meta);

    if (m.pending || m.applying) {
      const th = document.createElement("div");
      th.className = "thinking";
      th.innerHTML = '<span class="tdots"><i></i><i></i><i></i></span><span id="thinkText">' +
        (m.applying ? "正在应用你的补充…" : "正在处理… 0s") + "</span>";
      body.appendChild(th);
    } else if (m.error) {
      const e = document.createElement("div");
      e.className = "msgerr";
      e.textContent = m.error;
      body.appendChild(e);
    } else {
      const b = document.createElement("div");
      b.className = "bubble";
      if (m.role === "agent") b.innerHTML = md(m.text);
      else b.textContent = m.text;
      body.appendChild(b);
      if (m.role === "agent") {
        const line = document.createElement("div");
        line.className = "taskline";
        const bits = [];
        if (m.taskId) bits.push("<b>" + esc(String(m.taskId).slice(0, 8)) + "</b>");
        if (m.status) bits.push(esc(m.status));
        bits.push("点击复制");
        line.innerHTML = bits.join(" · ");
        line.style.cursor = "pointer";
        line.onclick = () => {
          navigator.clipboard.writeText(m.text || "").then(
            () => toast("已复制"),
            () => toast("复制失败")
          );
        };
        body.appendChild(line);
      }
    }
    row.appendChild(body);
    return row;
  }

  // the agent message that is still waiting (NOT simply the last one, because a
  // steering message from the user can be appended after it)
  function pendingMsg() {
    for (let i = state.messages.length - 1; i >= 0; i--) {
      if (state.messages[i].pending) return state.messages[i];
    }
    return null;
  }

  function scrollDown(force) {
    const near = el.main.scrollHeight - el.main.scrollTop - el.main.clientHeight < 220;
    if (force || near) requestAnimationFrame(() => { el.main.scrollTop = el.main.scrollHeight; });
  }
  function patchPending() {
    const m = pendingMsg();
    const t = document.getElementById("thinkText");
    if (m && m.pending && t) {
      const s = Math.round((Date.now() - m.startedAt) / 1000);
      t.textContent = "正在处理… " + s + "s";
    }
  }

  // ---------------------------------------------------------------- status
  async function refreshStatus() {
    try {
      const h = await api("/health");
      const r = await api("/api/agents");
      const list = r.agents || [];
      const busy = list.filter((a) => a.status === "busy").length;
      el.statusDot.className = "dot ok" + (busy ? " pulse" : "");
      el.statusText.textContent = list.length + " 名员工" + (busy ? " · " + busy + " 忙碌" : " · 空闲");
      el.statusChip.title = "API v" + (h.version || "?");
    } catch (e) {
      el.statusDot.className = "dot bad";
      el.statusText.textContent = "未连接";
    }
  }

  // ---------------------------------------------------------------- send
  function autoGrow() {
    el.input.style.height = "auto";
    el.input.style.height = Math.min(el.input.scrollHeight, 190) + "px";
  }

  async function send() {
    const text = el.input.value.trim();
    if (!text) return;
    el.input.value = "";
    autoGrow();

    // 运行中 -> 实时插话
    if (state.activeTaskId) {
      const m = { id: uid(), role: "user", text: text, ts: nowTime() };
      state.messages.push(m);
      const pending = state.messages.find((x) => x.pending);
      if (pending) pending.steeredSize = (pending.steeredSize || 0) + 1;
      render(); save();
      try {
        await steerTask(state.activeTaskId, text);
        toast("已补充给正在干活的 AI");
      } catch (e) {
        m.error = "补充失败：" + e.message;
        render();
      }
      return;
    }

    state.messages.push({ id: uid(), role: "user", text: text, ts: nowTime() });
    const agentMsg = {
      id: uid(), role: "agent", text: "", ts: nowTime(),
      pending: true, startedAt: Date.now(), status: "排队中",
    };
    state.messages.push(agentMsg);
    render(); save();

    try {
      const task = await createTask(text);
      const id = task.id;
      agentMsg.taskId = id;
      state.activeTaskId = id;
      setBusy(true);
      render(); save();
      poll(id);
    } catch (e) {
      agentMsg.pending = false;
      agentMsg.error = "创建任务失败：" + e.message;
      render(); save();
    }
  }

  function setBusy(b) {
    el.send.disabled = false;
    el.hintLeft.textContent = b
      ? "AI 正在干活 — 你还可以继续发消息，会实时补充给它"
      : "对话会记住上下文；AI 干活时可以继续插话补充";
  }

  function poll(taskId) {
    clearInterval(state.pollTimer);
    const started = Date.now();
    const tick = async () => {
      patchPending();
      try {
        const t = await getTask(taskId);
        const msg = pendingMsg();
        if (msg) {
          msg.status = t.status;
          if (t.agentId && state.agents[t.agentId]) msg.agentName = state.agents[t.agentId];
        }
        if (["completed", "failed", "cancelled", "canceled"].includes(t.status)) {
          clearInterval(state.pollTimer);
          state.pollTimer = null;
          await finish(t);
          return;
        }
        if (Date.now() - started > MAX_WAIT_MS) {
          clearInterval(state.pollTimer);
          state.pollTimer = null;
          if (msg && msg.pending) {
            msg.pending = false;
            msg.error = "等待超时（15 分钟）。任务可能仍在后台运行，可在 Sessions 页查看。";
          }
          state.activeTaskId = null;
          setBusy(false);
          render(); save();
        }
      } catch (e) { /* transient */ }
    };
    tick();
    state.pollTimer = setInterval(tick, POLL_MS);
  }

  async function finish(task) {
    const msg = pendingMsg();
    state.activeTaskId = null;
    setBusy(false);
    if (!msg) { render(); save(); return; }
    msg.pending = false;
    msg.status = task.status;
    if (task.agentId && state.agents[task.agentId]) msg.agentName = state.agents[task.agentId];
    if (task.status === "failed") {
      msg.error = "任务失败：" + (task.error || task.output || "未知原因");
    } else {
      let final = task;
      if (msg.steeredSize) {
        msg.applying = true;
        render();
        const t2 = await waitSteering(task.id);
        if (t2) final = t2;
        msg.applying = false;
      }
      const reply = await resolveReply(final);
      msg.text = reply || "（任务已完成，但没有文本输出 — 可在 Sessions 页查看完整过程）";
    }
    state.lastTaskId = task.id;
    render(); save();
    if (task.status === "completed") refreshStatus();
  }

  // ---------------------------------------------------------------- events
  el.send.onclick = send;
  el.input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
  });
  el.input.addEventListener("input", autoGrow);
  el.btnNew.onclick = () => {
    if (state.activeTaskId) { toast("有任务正在运行，先等它结束或刷新页面"); return; }
    if (!state.messages.length) return;
    if (!confirm("清空当前对话？AI 将不再记得之前的内容。")) return;
    state.messages = [];
    state.lastTaskId = null;
    save(); render();
  };

  // ---------------------------------------------------------------- boot
  if (!API_KEY) {
    el.statusDot.className = "dot bad";
    el.statusText.textContent = "缺少 API Key";
    el.input.placeholder = "未找到 /swarm-config.js —— 请先运行 setup.ps1 生成配置";
    el.input.disabled = true;
    el.send.disabled = true;
  }
  load();
  render();
  autoGrow();
  loadAgents().then(refreshStatus);
  refreshStatus();
  setInterval(refreshStatus, 15000);
  setInterval(patchPending, 1000);
  el.input.focus();

  // resume a task that was still running when the page was reloaded
  (function resume() {
    const p = pendingMsg();
    const id = state.activeTaskId || (p && p.taskId);
    if (p && id) {
      state.activeTaskId = id;
      setBusy(true);
      poll(id);
    } else {
      state.activeTaskId = null;
    }
  })();

  window.addEventListener("beforeunload", () => { if (state.activeTaskId) save(); });
})();
</script>
</body>
</html>

# Minimal Agent Swarm deployment for local verification.
# Services: minio + minio-init + agent-fs + api + lead + worker-1 + worker-2
# Harness: HARNESS_PROVIDER=opencode, authenticated with the host OpenCode
#          (commandcode) credentials bind-mounted from ./opencode-config.
#
# Usage:
#   docker compose -f docker-compose.swarm.yml --env-file .env up -d
#   docker compose -f docker-compose.swarm.yml logs -f
#   docker compose -f docker-compose.swarm.yml down

x-agent-entrypoint: &agent-entrypoint
  - /bin/sh
  - -ec
  - |
    ID_FILE="/workspace/personal/.agent-id"
    if [ -n "$${AGENT_ID:-}" ]; then
      printf '%s\n' "$$AGENT_ID" > "$$ID_FILE"
    elif [ -s "$$ID_FILE" ]; then
      AGENT_ID=$$(cat "$$ID_FILE")
    else
      AGENT_ID=$$(cat /proc/sys/kernel/random/uuid)
      printf '%s\n' "$$AGENT_ID" > "$$ID_FILE"
    fi
    export AGENT_ID
    # permission-repair: the bind-mount of opencode-config/auth.json makes Docker
    # create /home/worker/.local/share/opencode as root. If anything ever writes
    # there as root, the worker (uid 1001) can no longer open opencode.log.
    chown -R 1001:1001 /home/worker/.local/share/opencode 2>/dev/null || true
    chown -R 1001:1001 /home/worker/.config/opencode 2>/dev/null || true
    chown -R 1001:1001 /home/worker/.cache 2>/dev/null || true
    chown -R 1001:1001 /workspace/.opencode 2>/dev/null || true
    exec /docker-entrypoint.sh "$$@"
  - --

services:
  minio:
    image: quay.nju.edu.cn/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - agent_fs_minio:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  minio-init:
    image: quay.nju.edu.cn/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/agentfs
      "

  agent-fs:
    image: ghcr.dockerproxy.net/desplega-ai/agent-fs:0.13.7
    platform: linux/amd64
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      - AGENT_FS_HOME=/data
      - HOST=0.0.0.0
      - SERVER_HOST=0.0.0.0
      - PORT=7433
      - SERVER_PORT=7433
      - S3_ENDPOINT=http://minio:9000
      - S3_PUBLIC_ENDPOINT=http://localhost:9000
      - S3_BUCKET=agentfs
      - S3_ACCESS_KEY_ID=minioadmin
      - S3_SECRET_ACCESS_KEY=minioadmin
      - S3_REGION=us-east-1
      - S3_PROVIDER=minio
      - EMBEDDING_PROVIDER=local
    ports:
      # 容器内固定 7433；主机侧映射到 6433，避开 Windows/Hyper-V 动态保留段
      # （常见冲突区间：7346-7445）。见 docs/TROUBLESHOOTING.md「端口被保留」。
      - "6433:7433"
    volumes:
      - agent_fs_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:7433/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  api:
    image: agent-swarm:local
    build:
      context: ${SWARM_SRC}
      dockerfile: Dockerfile
    platform: linux/amd64
    stop_grace_period: 60s
    pids_limit: 1024
    depends_on:
      agent-fs:
        condition: service_healthy
    environment:
      - API_KEY=${API_KEY}
      - SECRETS_ENCRYPTION_KEY_FILE=/run/secrets/encryption_key
      - AGENT_FS_API_URL=http://agent-fs:7433
      - AGENT_FS_REGISTER_EMAIL=swarm-admin@agent-fs.local
      - MCP_BASE_URL=${MCP_BASE_URL}
      - APP_URL=${APP_URL}
      - MODEL_OVERRIDE=${MODEL_OVERRIDE}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - MEMORY_RATERS=implicit-citation,explicit-self
      - SLACK_DISABLE=true
      - HTTP_PROXY=http://host.docker.internal:18080
      - HTTPS_PROXY=http://host.docker.internal:18080
      - NO_PROXY=localhost,127.0.0.1,api,agent-fs,minio,minio-init,host.docker.internal,.local
    ports:
      - "3013:3013"
    volumes:
      - swarm_api_data:/app/data
    secrets:
      - encryption_key
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:3013/health || wget -q --spider http://localhost:3013/health || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  lead:
    image: agent-swarm-worker:local
    build:
      context: ${SWARM_SRC}
      dockerfile: Dockerfile.worker
      target: worker-slim
    entrypoint: *agent-entrypoint
    platform: linux/amd64
    stop_grace_period: 60s
    depends_on:
      api:
        condition: service_healthy
    environment:
      - HARNESS_PROVIDER=${HARNESS_PROVIDER}
      - MODEL_OVERRIDE=${MODEL_OVERRIDE}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - API_KEY=${API_KEY}
      - CMD_API_KEY=${CMD_API_KEY:-}
      - AGENT_ID=${LEAD_AGENT_ID:-}
      - AGENT_ROLE=lead
      - HTTP_PROXY=http://host.docker.internal:18080
      - HTTPS_PROXY=http://host.docker.internal:18080
      - NO_PROXY=localhost,127.0.0.1,api,agent-fs,minio,minio-init,host.docker.internal,.local
      - TEMPLATE_ID=official/lead
      - MCP_BASE_URL=http://api:3013
      - AGENT_FS_API_URL=http://agent-fs:7433
      - YOLO=true
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - SWARM_URL=${SWARM_URL:-localhost}
    ports:
      - "3020:3000"
    volumes:
      - swarm_logs:/logs
      - swarm_shared:/workspace/shared
      - swarm_lead:/workspace/personal
      - ./opencode-config/opencode.jsonc:/home/worker/.config/opencode/opencode.jsonc:ro
      - ./opencode-config/auth.json:/home/worker/.local/share/opencode/auth.json:ro
      # opencode 的插件/模型/会话缓存放卷里：容器重建后不用重新冷启动
      - swarm_opencode_lead:/home/worker/.local/share/opencode
      # 插件的 node_modules 也在容器可写层里，重建即重装（>30s 会导致 session create 超时）
      - swarm_ocws_lead:/workspace/.opencode
    restart: unless-stopped

  worker-1:
    image: agent-swarm-worker:local
    build:
      context: ${SWARM_SRC}
      dockerfile: Dockerfile.worker
      target: worker-slim
    entrypoint: *agent-entrypoint
    platform: linux/amd64
    stop_grace_period: 60s
    depends_on:
      api:
        condition: service_healthy
    environment:
      - HARNESS_PROVIDER=${HARNESS_PROVIDER}
      - MODEL_OVERRIDE=${MODEL_OVERRIDE}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - API_KEY=${API_KEY}
      - CMD_API_KEY=${CMD_API_KEY:-}
      - AGENT_ID=${WORKER_1_AGENT_ID:-}
      - AGENT_ROLE=worker
      - HTTP_PROXY=http://host.docker.internal:18080
      - HTTPS_PROXY=http://host.docker.internal:18080
      - NO_PROXY=localhost,127.0.0.1,api,agent-fs,minio,minio-init,host.docker.internal,.local
      - TEMPLATE_ID=official/coder
      - MCP_BASE_URL=http://api:3013
      - AGENT_FS_API_URL=http://agent-fs:7433
      - YOLO=true
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - SWARM_URL=${SWARM_URL:-localhost}
    ports:
      - "3021:3000"
    volumes:
      - swarm_logs:/logs
      - swarm_shared:/workspace/shared
      - swarm_worker_1:/workspace/personal
      - ./opencode-config/opencode.jsonc:/home/worker/.config/opencode/opencode.jsonc:ro
      - ./opencode-config/auth.json:/home/worker/.local/share/opencode/auth.json:ro
      # opencode 的插件/模型/会话缓存放卷里：容器重建后不用重新冷启动
      - swarm_opencode_w1:/home/worker/.local/share/opencode
      # 插件的 node_modules 也在容器可写层里，重建即重装（>30s 会导致 session create 超时）
      - swarm_ocws_w1:/workspace/.opencode
    restart: unless-stopped

  worker-2:
    image: agent-swarm-worker:local
    build:
      context: ${SWARM_SRC}
      dockerfile: Dockerfile.worker
      target: worker-slim
    entrypoint: *agent-entrypoint
    platform: linux/amd64
    stop_grace_period: 60s
    depends_on:
      api:
        condition: service_healthy
    environment:
      - HARNESS_PROVIDER=${HARNESS_PROVIDER}
      - MODEL_OVERRIDE=${MODEL_OVERRIDE}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - API_KEY=${API_KEY}
      - CMD_API_KEY=${CMD_API_KEY:-}
      - AGENT_ID=${WORKER_2_AGENT_ID:-}
      - AGENT_ROLE=worker
      - HTTP_PROXY=http://host.docker.internal:18080
      - HTTPS_PROXY=http://host.docker.internal:18080
      - NO_PROXY=localhost,127.0.0.1,api,agent-fs,minio,minio-init,host.docker.internal,.local
      - TEMPLATE_ID=official/coder
      - MCP_BASE_URL=http://api:3013
      - AGENT_FS_API_URL=http://agent-fs:7433
      - YOLO=true
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - SWARM_URL=${SWARM_URL:-localhost}
    ports:
      - "3022:3000"
    volumes:
      - swarm_logs:/logs
      - swarm_shared:/workspace/shared
      - swarm_worker_2:/workspace/personal
      - ./opencode-config/opencode.jsonc:/home/worker/.config/opencode/opencode.jsonc:ro
      - ./opencode-config/auth.json:/home/worker/.local/share/opencode/auth.json:ro
      # opencode 的插件/模型/会话缓存放卷里：容器重建后不用重新冷启动
      - swarm_opencode_w2:/home/worker/.local/share/opencode
      # 插件的 node_modules 也在容器可写层里，重建即重装（>30s 会导致 session create 超时）
      - swarm_ocws_w2:/workspace/.opencode
    restart: unless-stopped

secrets:
  encryption_key:
    file: ./encryption_key

volumes:
  agent_fs_minio:
  agent_fs_data:
  swarm_api_data:
  swarm_logs:
  swarm_shared:
  swarm_lead:
  swarm_worker_1:
  swarm_worker_2:
  swarm_opencode_lead:
  swarm_opencode_w1:
  swarm_opencode_w2:
  swarm_ocws_lead:
  swarm_ocws_w1:
  swarm_ocws_w2: